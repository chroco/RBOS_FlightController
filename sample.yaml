
sample:
  name: I2C custom target sample
tests:
  sample.drivers.i2c.custom_target:
    tags: i2c_target
    platform_allow:
      - lpcxpresso55s69/lpc55s69/cpu0
    harness: TBD
  sample.basic.servo_motor:
    tags:
      - drivers
      - pwm
    depends_on: pwm
    harness: motor
    filter: dt_compat_enabled("pwm-servo")
    integration_platforms:
      - bbc_microbit


    sample.drivers.adc.adc_dt:
    tags:
      - adc
    depends_on: adc
    platform_allow:
      - esp32_devkitc_wroom/esp32/procpu
      - esp32_devkitc_wrover/esp32/procpu
      - esp32s2_saola
      - esp32c3_devkitm
    integration_platforms:
      - nucleo_l073rz
      - nrf52840dk/nrf52840
    harness: console
    timeout: 10
    harness_config:
      type: multi_line
      regex:
        - "ADC reading\\[\\d+\\]:"
        - "- .+, channel \\d+: -?\\d+"
